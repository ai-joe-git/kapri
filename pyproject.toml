[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kapri-ai"
version = "0.2.2"
description = "Run AI locally. Beautifully. A drop-in replacement for Ollama."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["llm", "ai", "local", "llama", "inference", "ollama", "gguf"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.23.0",
    "psutil>=5.9.0",
]

[project.scripts]
kapri = "kapri.cli:main"

[project.urls]
Homepage = "https://kapri-ten.vercel.app"
Repository = "https://github.com/kapri-ai/kapri"
Issues = "https://github.com/kapri-ai/kapri/issues"

[tool.setuptools]
packages = ["kapri"]

[tool.setuptools.package-data]
kapri = ["registry/models.json"]