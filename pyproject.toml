[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kapri-ai"
version = "0.1.0"
description = "Run AI locally. Beautifully. A drop-in replacement for Ollama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["llm", "ai", "local", "llama", "inference", "ollama", "gguf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.23.0",
    "psutil>=5.9.0",
]

[project.scripts]
kapri = "kapri.cli:app"

[project.urls]
Homepage = "https://getkapri.dev"
Repository = "https://github.com/kapri-ai/kapri"
Issues = "https://github.com/kapri-ai/kapri/issues"