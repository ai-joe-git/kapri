<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Models — Kapri</title>
<meta name="description" content="Browse and search GGUF models for Kapri. Pull any model from HuggingFace.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #fff;
  color: #000;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Navigation */
header { position: sticky; top: 0; z-index: 40; background: #fff; }
nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 24px;
  border-bottom: 1px solid #f5f5f5;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 18px;
  color: #000;
  text-decoration: none;
}
.nav-logo svg { width: 32px; height: 32px; }
.nav-links {
  display: flex;
  align-items: center;
  gap: 24px;
  font-size: 16px;
}
.nav-links a {
  color: #000;
  text-decoration: none;
}
.nav-links a:hover { text-decoration: underline; }
.nav-links a.active { text-decoration: underline; }
.nav-right { display: flex; align-items: center; gap: 8px; }
.btn-nav {
  display: inline-flex;
  align-items: center;
  padding: 6px 16px;
  border-radius: 9999px;
  font-size: 16px;
  text-decoration: none;
  transition: all 0.15s;
}
.btn-nav-ghost {
  background: rgba(0,0,0,0.05);
  color: #000;
}
.btn-nav-ghost:hover { background: rgba(0,0,0,0.1); }
.btn-nav-primary {
  background: #262626;
  color: #fff;
}
.btn-nav-primary:hover { background: #000; }

/* Main Content */
main {
  max-width: 1152px;
  margin: 0 auto;
  padding: 48px 24px 96px;
  flex: 1;
}

/* Search */
.search-container {
  max-width: 600px;
  margin: 0 auto 48px;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0,0,0,0.05);
  border: 1px solid #e5e5e5;
  border-radius: 9999px;
  padding: 12px 20px;
}
.search-box svg {
  width: 20px;
  height: 20px;
  color: #737373;
  flex-shrink: 0;
}
.search-box input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 16px;
  outline: none;
  color: #000;
}
.search-box input::placeholder { color: #737373; }

/* Models Grid */
.models-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.model-card {
  border: 1px solid #e5e5e5;
  border-radius: 12px;
  padding: 20px;
  transition: border-color 0.15s;
}
.model-card:hover { border-color: #a3a3a3; }
.model-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 8px;
}
.model-name {
  font-size: 16px;
  font-weight: 600;
  color: #000;
}
.model-size {
  font-size: 14px;
  color: #737373;
}
.model-desc {
  font-size: 14px;
  color: #525252;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.model-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.tag {
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid #e5e5e5;
  border-radius: 9999px;
  color: #525252;
}
.model-cmd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.03);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13px;
  color: #525252;
}
.model-cmd button {
  background: none;
  border: none;
  color: #737373;
  cursor: pointer;
  padding: 4px;
  display: flex;
  transition: color 0.15s;
}
.model-cmd button:hover { color: #000; }
.model-cmd svg { width: 16px; height: 16px; }

/* Empty State */
.empty-state {
  text-align: center;
  padding: 64px 24px;
  color: #737373;
}
.empty-state svg {
  width: 48px;
  height: 48px;
  margin-bottom: 16px;
  color: #d4d4d4;
}

/* Footer */
footer { margin-top: auto; }
.footer-desktop {
  display: none;
  padding: 14px 24px;
  border-top: 1px solid #f5f5f5;
}
@media (min-width: 768px) {
  .footer-desktop { display: block; }
}
.footer-desktop .footer-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1152px;
  margin: 0 auto;
}
.footer-desktop .copyright { font-size: 12px; color: #737373; }
.footer-desktop .footer-links {
  display: flex;
  gap: 24px;
  font-size: 12px;
}
.footer-desktop .footer-links a {
  color: #737373;
  text-decoration: none;
}
.footer-desktop .footer-links a:hover { text-decoration: underline; }

.footer-mobile { padding: 16px; }
@media (min-width: 768px) {
  .footer-mobile { display: none; }
}
.footer-mobile ul {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 16px;
  font-size: 14px;
  list-style: none;
}
.footer-mobile a { color: #737373; text-decoration: none; }
.footer-mobile a:hover { text-decoration: underline; }
.footer-mobile .copyright {
  text-align: center;
  font-size: 14px;
  color: #737373;
  margin-top: 8px;
}

/* Mobile Menu */
.mobile-menu-toggle { display: none; }
@media (max-width: 767px) {
  .nav-links, .nav-right { display: none; }
  .mobile-menu-toggle { display: block; }
}
.mobile-menu-toggle button {
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
}
.mobile-menu-toggle svg { width: 24px; height: 24px; }
</style>
</head>
<body>

<header>
  <nav>
    <a href="/" class="nav-logo">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M8 20L16 6L24 20H8Z" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M6 22L16 28L26 22H6Z" stroke="currentColor" stroke-width="2" fill="none"/>
      </svg>
      kapri
    </a>
    <div class="nav-links">
      <a href="/models.html" class="active">Models</a>
      <a href="https://github.com/ai-joe-git/kapri" target="_blank">GitHub</a>
      <a href="https://pypi.org/project/kapri-ai/" target="_blank">PyPI</a>
    </div>
    <div class="nav-right">
      <a href="https://github.com/ai-joe-git/kapri" target="_blank" class="btn-nav btn-nav-ghost">GitHub</a>
      <a href="/#download" class="btn-nav btn-nav-primary">Download</a>
    </div>
    <div class="mobile-menu-toggle">
      <button>
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
    </div>
  </nav>
</header>

<main>
  <div class="search-container">
    <div class="search-box">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
      </svg>
      <input type="text" id="searchInput" placeholder="Search models..." oninput="filterModels()">
    </div>
  </div>

  <div class="models-grid" id="modelsGrid">
    <!-- Populated by JS -->
  </div>

  <div class="empty-state" id="emptyState" style="display: none;">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.182 16.318A4.486 4.486 0 0012.016 15a4.486 4.486 0 00-3.198 1.318M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75zm-.375 0h.008v.015h-.008V9.75zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75z" />
    </svg>
    <p>No models found</p>
  </div>
</main>

<footer>
  <div class="footer-desktop">
    <div class="footer-inner">
      <div class="copyright">© 2026 Kapri</div>
      <div class="footer-links">
        <a href="https://pypi.org/project/kapri-ai/" target="_blank">PyPI</a>
        <a href="https://github.com/ai-joe-git/kapri" target="_blank">GitHub</a>
        <a href="https://github.com/ai-joe-git/kapri/blob/main/LICENSE" target="_blank">MIT License</a>
      </div>
    </div>
  </div>
  <div class="footer-mobile">
    <ul>
      <li><a href="https://pypi.org/project/kapri-ai/" target="_blank">PyPI</a></li>
      <li><a href="https://github.com/ai-joe-git/kapri" target="_blank">GitHub</a></li>
    </ul>
    <p class="copyright">© 2026 Kapri</p>
  </div>
</footer>

<script>
const defaultModels = [
  { id: 'llama3.2-3b', name: 'Llama 3.2 3B Instruct', description: 'Meta compact 3B model', tags: ['small', 'fast'], size_gb: 2.0 },
  { id: 'llama3.2-1b', name: 'Llama 3.2 1B Instruct', description: 'Ultra compact Llama model', tags: ['tiny', 'fast'], size_gb: 0.8 },
  { id: 'qwen2.5-coder-7b', name: 'Qwen 2.5 Coder 7B', description: 'Specialized code model', tags: ['coding'], size_gb: 4.4 },
  { id: 'qwen2.5-7b', name: 'Qwen 2.5 7B Instruct', description: 'Powerful coding and math', tags: ['medium', 'coding'], size_gb: 4.4 },
  { id: 'qwen2.5-3b', name: 'Qwen 2.5 3B Instruct', description: 'Compact Qwen model', tags: ['small', 'fast'], size_gb: 2.0 },
  { id: 'qwen2.5-1.5b', name: 'Qwen 2.5 1.5B Instruct', description: 'Tiny Qwen model', tags: ['tiny', 'fast'], size_gb: 1.0 },
  { id: 'mistral-7b', name: 'Mistral 7B Instruct', description: 'Classic open model', tags: ['general'], size_gb: 4.1 },
  { id: 'deepseek-r1-7b', name: 'DeepSeek R1 Distill 7B', description: 'Reasoning model', tags: ['reasoning'], size_gb: 4.4 },
  { id: 'deepseek-r1-1.5b', name: 'DeepSeek R1 Distill 1.5B', description: 'Compact reasoning model', tags: ['reasoning', 'tiny'], size_gb: 1.1 },
  { id: 'tinyllama', name: 'TinyLlama 1.1B', description: 'Ultra compact', tags: ['tiny', 'fast'], size_gb: 0.7 },
  { id: 'phi-3-mini', name: 'Phi-3 Mini 3.8B', description: 'Microsoft compact model', tags: ['small', 'coding'], size_gb: 2.3 },
  { id: 'gemma-2-9b', name: 'Gemma 2 9B Instruct', description: 'Google open model', tags: ['medium', 'general'], size_gb: 5.5 },
  { id: 'gemma-2-2b', name: 'Gemma 2 2B Instruct', description: 'Compact Google model', tags: ['small', 'fast'], size_gb: 1.4 },
  { id: 'llama3.1-8b', name: 'Llama 3.1 8B Instruct', description: 'Meta flagship small model', tags: ['medium', 'general'], size_gb: 4.7 },
  { id: 'codellama-7b', name: 'Code Llama 7B', description: 'Code generation model', tags: ['coding'], size_gb: 4.1 },
];

function renderModels(models) {
  const grid = document.getElementById('modelsGrid');
  const empty = document.getElementById('emptyState');
  
  if (models.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  
  grid.style.display = 'grid';
  empty.style.display = 'none';
  
  grid.innerHTML = models.map(m => `
    <div class="model-card" data-id="${m.id}" data-name="${m.name.toLowerCase()}" data-tags="${m.tags.join(',')}">
      <div class="model-header">
        <span class="model-name">${m.name}</span>
        <span class="model-size">${m.size_gb}GB</span>
      </div>
      <p class="model-desc">${m.description}</p>
      <div class="model-tags">
        ${m.tags.map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
      <div class="model-cmd">
        <span>kapri pull ${m.id}</span>
        <button onclick="copyCmd(this, 'kapri pull ${m.id}')">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184" />
          </svg>
        </button>
      </div>
    </div>
  `).join('');
}

function filterModels() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = defaultModels.filter(m => 
    m.id.toLowerCase().includes(query) || 
    m.name.toLowerCase().includes(query) || 
    m.tags.some(t => t.includes(query))
  );
  renderModels(filtered);
}

function copyCmd(btn, cmd) {
  navigator.clipboard.writeText(cmd).then(() => {
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:16px;height:16px;"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>';
    setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
  });
}

// Try to fetch from registry, fallback to defaults
async function loadModels() {
  try {
    const resp = await fetch('https://kapri-registry-8juoldydj-aijoes-projects.vercel.app/models.json', { 
      signal: AbortSignal.timeout(3000) 
    });
    const models = await resp.json();
    defaultModels.length = 0;
    defaultModels.push(...models);
  } catch (e) {
    console.log('Using default models');
  }
  renderModels(defaultModels);
}

loadModels();
</script>

</body>
</html>
