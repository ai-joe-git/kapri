<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Models — Kapri</title>
<meta name="description" content="Browse and search GGUF models for Kapri. Pull any model from HuggingFace.">
<meta property="og:title" content="Kapri Models">
<meta property="og:description" content="Browse and search GGUF models for Kapri. Pull any model from HuggingFace.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #fff;
  color: #000;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Navigation */
header { position: sticky; top: 0; z-index: 40; background: #fff; }
nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 24px;
  border-bottom: 1px solid #f5f5f5;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 18px;
  color: #000;
  text-decoration: none;
  cursor: pointer;
}
.nav-logo svg { width: 32px; height: 32px; }
.nav-links {
  display: flex;
  align-items: center;
  gap: 24px;
  font-size: 16px;
}
.nav-links a {
  color: #000;
  text-decoration: none;
  cursor: pointer;
}
.nav-links a:hover { text-decoration: underline; }
.nav-links a.active { text-decoration: underline; }
.nav-right { display: flex; align-items: center; gap: 8px; }
.btn-nav {
  display: inline-flex;
  align-items: center;
  padding: 6px 16px;
  border-radius: 9999px;
  font-size: 16px;
  text-decoration: none;
  transition: all 0.15s;
  cursor: pointer;
}
.btn-nav-ghost {
  background: rgba(0,0,0,0.05);
  color: #000;
  border: none;
}
.btn-nav-ghost:hover { background: rgba(0,0,0,0.1); }
.btn-nav-primary {
  background: #262626;
  color: #fff;
  border: none;
}
.btn-nav-primary:hover { background: #000; }

/* Main Content */
main {
  max-width: 1152px;
  margin: 0 auto;
  padding: 48px 24px 96px;
  flex: 1;
  width: 100%;
}

/* Search */
.search-container {
  max-width: 600px;
  margin: 0 auto 48px;
  transition: opacity 0.2s;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0,0,0,0.05);
  border: 1px solid #e5e5e5;
  border-radius: 9999px;
  padding: 12px 20px;
}
.search-box svg {
  width: 20px;
  height: 20px;
  color: #737373;
  flex-shrink: 0;
}
.search-box input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 16px;
  outline: none;
  color: #000;
}
.search-box input::placeholder { color: #737373; }

/* Models Grid */
.models-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
@media (min-width: 640px) {
  .models-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 1024px) {
  .models-grid { grid-template-columns: repeat(3, 1fr); }
}
.model-card {
  border: 1px solid #e5e5e5;
  border-radius: 12px;
  padding: 20px;
  transition: border-color 0.15s, box-shadow 0.15s;
  cursor: pointer;
}
.model-card:hover { border-color: #a3a3a3; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.model-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 8px;
}
.model-name { font-size: 16px; font-weight: 600; color: #000; }
.model-size { font-size: 14px; color: #737373; }
.model-desc {
  font-size: 14px;
  color: #525252;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.model-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.tag {
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid #e5e5e5;
  border-radius: 9999px;
  color: #525252;
}
.model-cmd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.03);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13px;
  color: #525252;
}
.model-cmd button, .quant-copy {
  background: none;
  border: none;
  color: #737373;
  cursor: pointer;
  padding: 4px;
  display: flex;
  transition: color 0.15s;
}
.model-cmd button:hover, .quant-copy:hover { color: #000; }
.model-cmd svg, .quant-copy svg { width: 16px; height: 16px; }

/* Empty State */
.empty-state {
  text-align: center;
  padding: 64px 24px;
  color: #737373;
}
.empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; color: #d4d4d4; }

/* === Model Detail === */
.detail-hidden { display: none !important; }

.back-row {
  margin-bottom: 24px;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: #525252;
  cursor: pointer;
  border: none;
  background: none;
  padding: 4px 0;
}
.back-btn:hover { color: #000; }
.back-btn svg { width: 16px; height: 16px; }

.detail-hero {
  margin-bottom: 32px;
}
.detail-hero h1 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
}
.detail-hero p {
  font-size: 16px;
  color: #525252;
  margin-bottom: 16px;
  max-width: 720px;
}
.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 20px;
}
.detail-tags .tag {
  font-size: 13px;
  padding: 5px 12px;
  border-color: #d4d4d4;
}
.detail-cmd {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #f5f5f5;
  border: 1px solid #e5e5e5;
  border-radius: 8px;
  padding: 10px 16px;
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 14px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}
@media (min-width: 640px) {
  .stats-grid { grid-template-columns: repeat(4, 1fr); }
}
.stat-card {
  border: 1px solid #e5e5e5;
  border-radius: 10px;
  padding: 14px 16px;
}
.stat-label { font-size: 12px; color: #737373; margin-bottom: 4px; }
.stat-value { font-size: 16px; font-weight: 600; }

.quant-section { margin-bottom: 32px; }
.quant-section h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 12px;
}
.quant-table {
  width: 100%;
  border-collapse: collapse;
}
.quant-table th {
  text-align: left;
  font-size: 12px;
  color: #737373;
  font-weight: 500;
  padding: 8px 12px;
  border-bottom: 1px solid #f5f5f5;
}
.quant-table td {
  padding: 10px 12px;
  border-bottom: 1px solid #f5f5f5;
  font-size: 14px;
}
.quant-table tr:hover { background: rgba(0,0,0,0.02); }
.quant-table tr.default { background: rgba(38,38,38,0.04); }
.quant-table tr.default td:first-child { font-weight: 600; }
.quant-name {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13px;
}
.quant-name sup {
  font-size: 10px;
  background: #262626;
  color: #fff;
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 6px;
  font-weight: 600;
}
.quant-cmd-row {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13px;
  color: #525252;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Model Card (markdown) */
.model-card-section {
  margin-top: 32px;
}
.model-card-section h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
}
.markdown-body {
  border: 1px solid #e5e5e5;
  border-radius: 12px;
  padding: 24px;
  font-size: 14px;
  line-height: 1.7;
  color: #262626;
  max-height: none;
  overflow: visible;
}
.markdown-body h1 { font-size: 20px; font-weight: 700; margin: 24px 0 12px; }
.markdown-body h1:first-child { margin-top: 0; }
.markdown-body h2 { font-size: 17px; font-weight: 600; margin: 20px 0 10px; }
.markdown-body h3 { font-size: 15px; font-weight: 600; margin: 16px 0 8px; }
.markdown-body p { margin-bottom: 12px; }
.markdown-body ul, .markdown-body ol { margin: 8px 0 16px 24px; }
.markdown-body li { margin-bottom: 4px; }
.markdown-body code {
  background: rgba(0,0,0,0.06);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13px;
}
.markdown-body pre {
  background: #f5f5f5;
  border: 1px solid #e5e5e5;
  border-radius: 8px;
  padding: 16px;
  overflow-x: auto;
  margin: 12px 0 16px;
}
.markdown-body pre code {
  background: none;
  padding: 0;
  font-size: 13px;
}
.markdown-body a {
  color: #262626;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.markdown-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 13px;
}
.markdown-body th, .markdown-body td {
  border: 1px solid #e5e5e5;
  padding: 8px 12px;
  text-align: left;
}
.markdown-body th { background: rgba(0,0,0,0.03); font-weight: 600; }
.markdown-body strong { font-weight: 600; }
.markdown-body blockquote {
  border-left: 3px solid #e5e5e5;
  padding-left: 16px;
  color: #525252;
  margin: 12px 0;
}
.markdown-body hr { border: none; border-top: 1px solid #e5e5e5; margin: 24px 0; }
.markdown-body img { max-width: 100%; border-radius: 8px; }

.hf-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #525252;
  text-decoration: none;
  margin-top: 16px;
}
.hf-link:hover { color: #000; text-decoration: underline; }
.hf-link svg { width: 14px; height: 14px; }

.loading {
  text-align: center;
  padding: 32px;
  color: #737373;
}
.spinner {
  display: inline-block;
  width: 20px; height: 20px;
  border: 2px solid #e5e5e5;
  border-top-color: #262626;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
footer { margin-top: auto; }
.footer-desktop {
  display: none;
  padding: 14px 24px;
  border-top: 1px solid #f5f5f5;
}
@media (min-width: 768px) { .footer-desktop { display: block; } }
.footer-desktop .footer-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1152px;
  margin: 0 auto;
}
.footer-desktop .copyright { font-size: 12px; color: #737373; }
.footer-desktop .footer-links { display: flex; gap: 24px; font-size: 12px; }
.footer-desktop .footer-links a { color: #737373; text-decoration: none; }
.footer-desktop .footer-links a:hover { text-decoration: underline; }

.footer-mobile { padding: 16px; }
@media (min-width: 768px) { .footer-mobile { display: none; } }
.footer-mobile ul {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 16px;
  font-size: 14px;
  list-style: none;
}
.footer-mobile a { color: #737373; text-decoration: none; }
.footer-mobile a:hover { text-decoration: underline; }
.footer-mobile .copyright {
  text-align: center;
  font-size: 14px;
  color: #737373;
  margin-top: 8px;
}

/* Mobile Menu */
.mobile-menu-toggle { display: none; }
@media (max-width: 767px) {
  .nav-links, .nav-right { display: none; }
  .mobile-menu-toggle { display: block; }
}
.mobile-menu-toggle button {
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
}
.mobile-menu-toggle svg { width: 24px; height: 24px; }
</style>
</head>
<body>

<header>
  <nav>
    <a class="nav-logo" onclick="showGrid()">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M8 20L16 6L24 20H8Z" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M6 22L16 28L26 22H6Z" stroke="currentColor" stroke-width="2" fill="none"/>
      </svg>
      kapri
    </a>
    <div class="nav-links">
      <a class="active" onclick="showGrid()">Models</a>
      <a href="https://github.com/ai-joe-git/kapri" target="_blank">GitHub</a>
      <a href="https://pypi.org/project/kapri-ai/" target="_blank">PyPI</a>
    </div>
    <div class="nav-right">
      <a href="https://github.com/ai-joe-git/kapri" target="_blank" class="btn-nav btn-nav-ghost">GitHub</a>
      <a href="/#download" class="btn-nav btn-nav-primary">Download</a>
    </div>
    <div class="mobile-menu-toggle">
      <button>
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
    </div>
  </nav>
</header>

<main>
  <!-- Grid view -->
  <div id="gridView">
    <div class="search-container" id="searchContainer">
      <div class="search-box">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
        <input type="text" id="searchInput" placeholder="Search models..." oninput="filterModels()">
      </div>
    </div>
    <div class="models-grid" id="modelsGrid"></div>
    <div class="empty-state" id="emptyState" style="display: none;">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.182 16.318A4.486 4.486 0 0012.016 15a4.486 4.486 0 00-3.198 1.318M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75zm-.375 0h.008v.015h-.008V9.75zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75z" />
      </svg>
      <p>No models found</p>
    </div>
  </div>

  <!-- Detail view -->
  <div id="detailView" class="detail-hidden">
    <div class="back-row">
      <button class="back-btn" onclick="showGrid()">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        Back to models
      </button>
    </div>
    <div id="detailContent"></div>
  </div>
</main>

<footer>
  <div class="footer-desktop">
    <div class="footer-inner">
      <div class="copyright">© 2026 Kapri</div>
      <div class="footer-links">
        <a href="https://pypi.org/project/kapri-ai/" target="_blank">PyPI</a>
        <a href="https://github.com/ai-joe-git/kapri" target="_blank">GitHub</a>
        <a href="https://github.com/ai-joe-git/kapri/blob/main/LICENSE" target="_blank">MIT License</a>
      </div>
    </div>
  </div>
  <div class="footer-mobile">
    <ul>
      <li><a href="https://pypi.org/project/kapri-ai/" target="_blank">PyPI</a></li>
      <li><a href="https://github.com/ai-joe-git/kapri" target="_blank">GitHub</a></li>
    </ul>
    <p class="copyright">© 2026 Kapri</p>
  </div>
</footer>

<script>
let registryModels = [];
const REGISTRY_URL = 'https://kapri-registry.vercel.app/models.json';
const DEFAULT_QUANT = 'Q4_K_XL';

marked.setOptions({ breaks: true, gfm: true });

function fmt(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(n);
}

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function fmtGB(v) {
  if (typeof v !== 'number' || v <= 0) return '—';
  return v >= 100 ? `${v.toFixed(0)} GB` : `${v.toFixed(1)} GB`;
}

// ─── Grid ─────────────────────────────────────

function renderGrid(models) {
  const grid = document.getElementById('modelsGrid');
  const empty = document.getElementById('emptyState');

  if (models.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  grid.style.display = 'grid';
  empty.style.display = 'none';

  grid.innerHTML = models.map(m => {
    const defaultSize = m.size_gb && m.size_gb[DEFAULT_QUANT] ? m.size_gb[DEFAULT_QUANT] : (m.size_gb && Object.values(m.size_gb)[0]) || '-';
    const sizeStr = typeof defaultSize === 'number' ? fmtGB(defaultSize) : defaultSize;
    return `
    <div class="model-card" onclick="showDetail('${m.id}')">
      <div class="model-header">
        <span class="model-name">${m.name}</span>
        <span class="model-size">${sizeStr}</span>
      </div>
      <p class="model-desc">${m.description || ''}</p>
      <div class="model-tags">
        ${(m.tags || []).slice(0, 5).map(t => `<span class="tag">${t}</span>`).join('')}
        ${(m.tags || []).length > 5 ? `<span class="tag">+${m.tags.length - 5}</span>` : ''}
      </div>
      <div class="model-cmd" onclick="event.stopPropagation()">
        <span>kapri pull ${m.id}</span>
        <button onclick="copyCmd(this, 'kapri pull ${m.id}')">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184" />
          </svg>
        </button>
      </div>
    </div>
  `}).join('');
}

function filterModels() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = registryModels.filter(m =>
    m.id.toLowerCase().includes(query) ||
    m.name.toLowerCase().includes(query) ||
    (m.tags || []).some(t => t.includes(query)) ||
    (m.description || '').toLowerCase().includes(query)
  );
  renderGrid(filtered);
}

function copyCmd(btn, cmd) {
  navigator.clipboard.writeText(cmd).then(() => {
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:16px;height:16px;color:#4ade80;"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>';
    setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
  });
}

// ─── Detail ───────────────────────────────────

function showGrid() {
  history.replaceState(null, '', 'models.html');
  document.getElementById('gridView').classList.remove('detail-hidden');
  document.getElementById('detailView').classList.add('detail-hidden');
  renderGrid(registryModels);
}

function showDetail(modelId) {
  const model = registryModels.find(m => m.id === modelId);
  if (!model) return showGrid();

  window.location.hash = modelId;
  history.replaceState(null, `${model.name} — Kapri`, `models.html#${modelId}`);
  document.getElementById('gridView').classList.add('detail-hidden');
  document.getElementById('detailView').classList.remove('detail-hidden');
  document.getElementById('detailContent').innerHTML = renderDetail(model);
  document.getElementById('detailContent').scrollIntoView({ behavior: 'smooth', block: 'start' });

  fetchHFMeta(model);
  fetchModelCard(model);
}

function renderDetail(model) {
  const quants = model.quants || [];
  const defaultSize = model.size_gb && model.size_gb[DEFAULT_QUANT] ? model.size_gb[DEFAULT_QUANT] : null;

  let quantRows = quants.map(q => {
    const sz = model.size_gb && model.size_gb[q] ? model.size_gb[q] : null;
    const isDefault = q === DEFAULT_QUANT;
    return `
    <tr class="${isDefault ? 'default' : ''}">
      <td><span class="quant-name">${q}${isDefault ? '<sup>default</sup>' : ''}</span></td>
      <td>${sz !== null ? fmtGB(sz) : '—'}</td>
      <td>
        <span class="quant-cmd-row">
          kapri pull ${model.id}:${q}
          <button class="quant-copy" onclick="copyCmd(this, 'kapri pull ${model.id}:${q}')">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184" />
            </svg>
          </button>
        </span>
      </td>
    </tr>`;
  }).join('');

  const caps = (model.capabilities || []).map(c => c.charAt(0).toUpperCase() + c.slice(1)).join(' · ');

  return `
    <div class="detail-hero">
      <h1>${model.name}</h1>
      <p>${model.description || ''}</p>
      <div class="detail-tags">
        ${(model.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
      <div class="detail-cmd">
        kapri pull ${model.id}
        <button style="background:none;border:none;cursor:pointer;padding:4px;color:#737373;" onclick="copyCmd(this, 'kapri pull ${model.id}')">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:16px;height:16px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184" />
          </svg>
        </button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Context</div>
        <div class="stat-value">${model.context ? fmt(model.context) : '—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Default Size</div>
        <div class="stat-value">${defaultSize !== null ? fmtGB(defaultSize) : '—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Capabilities</div>
        <div class="stat-value">${caps || '—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">License</div>
        <div class="stat-value" style="text-transform:capitalize;">${model.license || '—'}</div>
      </div>
      <div class="stat-card" id="stat-downloads" style="display:none;">
        <div class="stat-label">Downloads</div>
        <div class="stat-value" id="val-downloads"></div>
      </div>
      <div class="stat-card" id="stat-likes" style="display:none;">
        <div class="stat-label">Likes</div>
        <div class="stat-value" id="val-likes"></div>
      </div>
      <div class="stat-card" id="stat-updated" style="display:none;">
        <div class="stat-label">Updated</div>
        <div class="stat-value" id="val-updated"></div>
      </div>
      <div class="stat-card" id="stat-arch" style="display:none;">
        <div class="stat-label">Architecture</div>
        <div class="stat-value" id="val-arch"></div>
      </div>
    </div>

    <div class="quant-section">
      <h2>Available Quants (${quants.length})</h2>
      <div style="overflow-x:auto;">
        <table class="quant-table">
          <thead>
            <tr>
              <th>Quantization</th>
              <th>Size</th>
              <th>Pull Command</th>
            </tr>
          </thead>
          <tbody>
            ${quantRows}
          </tbody>
        </table>
      </div>
    </div>

    <div class="model-card-section">
      <h2>Model Card</h2>
      <div id="modelCardContent" class="markdown-body">
        <div class="loading"><span class="spinner"></span>Loading model card from HuggingFace...</div>
      </div>
      <a class="hf-link" href="https://huggingface.co/${model.hf_repo}" target="_blank">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" /></svg>
        View on HuggingFace
      </a>
    </div>
  `;
}

async function fetchHFMeta(model) {
  try {
    const resp = await fetch(`https://huggingface.co/api/models/${model.hf_repo}`, {
      signal: AbortSignal.timeout(5000)
    });
    if (!resp.ok) return;
    const data = await resp.json();

    if (data.downloads) {
      document.getElementById('stat-downloads').style.display = '';
      document.getElementById('val-downloads').textContent = fmt(data.downloads);
    }
    if (data.likes) {
      document.getElementById('stat-likes').style.display = '';
      document.getElementById('val-likes').textContent = fmt(data.likes);
    }
    if (data.lastModified) {
      document.getElementById('stat-updated').style.display = '';
      document.getElementById('val-updated').textContent = fmtDate(data.lastModified);
    }
    if (data.gguf && data.gguf.architecture) {
      document.getElementById('stat-arch').style.display = '';
      document.getElementById('val-arch').textContent = data.gguf.architecture;
    }
  } catch (e) {}
}

async function fetchModelCard(model) {
  const el = document.getElementById('modelCardContent');
  if (!el) return;
  try {
    const resp = await fetch(`https://huggingface.co/${model.hf_repo}/raw/main/README.md`, {
      signal: AbortSignal.timeout(8000)
    });
    if (!resp.ok) throw new Error('Not found');
    const md = await resp.text();
    const html = marked.parse(md);
    el.innerHTML = html;
    // Make all external links open in new tab
    el.querySelectorAll('a').forEach(a => {
      if (a.href && !a.href.startsWith('#')) a.target = '_blank';
    });
  } catch (e) {
    el.innerHTML = '<p style="color:#737373;">Model card not available.</p>';
  }
}

// ─── Routing ──────────────────────────────────

function handleHash() {
  const hash = window.location.hash.slice(1);
  if (hash && registryModels.length > 0) {
    showDetail(hash);
  } else {
    showGrid();
  }
}

window.addEventListener('hashchange', handleHash);

// ─── Init ─────────────────────────────────────

async function loadModels() {
  try {
    const resp = await fetch(REGISTRY_URL, { signal: AbortSignal.timeout(5000) });
    const models = await resp.json();

    // Sort: smaller models first
    models.sort((a, b) => {
      const sa = a.size_gb && a.size_gb[DEFAULT_QUANT] ? a.size_gb[DEFAULT_QUANT] : 999;
      const sb = b.size_gb && b.size_gb[DEFAULT_QUANT] ? b.size_gb[DEFAULT_QUANT] : 999;
      return sa - sb;
    });

    registryModels = models;
  } catch (e) {
    console.log('Using empty registry');
  }
  handleHash();
}

loadModels();
</script>
